<!DOCTYPE html>
<html lang="zh-Hant">     <!--設定網站語言為繁中-->
<head>     <!--放網站設定-->
    <meta charset="UTF-8">     <!--設定網站編碼-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">     <!--設定瀏覽器畫面範圍、縮放-->
    <title>小寶專屬HBD網頁</title>     <!--瀏覽器分頁名稱-->
</head>
<body>     <!--真正會顯示在網頁上的東西-->
    <h1>驗證身分</h1>     <!--最大層級的標題-->
    <p>請輸入您的綽號：</p>     <!--提示文字-->
    <input id="nameInput" type="text">     <!--建立輸入欄位，接受一般文字-->
    <button id="checkButton">解鎖</button>     <!--解鎖按鈕-->
    <script src="script.js"></script>     <!--連結外部JS檔案-->
</body>
</html>
